name: Release

# On a version tag: build the install zip and attach it to the GitHub release. The DevLMS payment hub installs
# gateways from this zip and checks it against the SHA-256 GitHub publishes for it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build and attach the install zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          component=$(sed -nE "s/^\\\$plugin->component *= *'([a-z]+)_([a-z0-9_]+)';.*/\1_\2/p" version.php)
          name=${component#*_}
          zip="${component}-${TAG#v}.zip"
          git archive --format=zip --prefix="$name/" -o "$zip" "$TAG" -- . ':!.github' ':!.gitattributes' ':!.gitignore'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            pre=$(grep -q 'MATURITY_STABLE' version.php && echo '' || echo '--prerelease')
            gh release create "$TAG" "$zip" --title "${TAG#v}" --notes "Install zip: $zip" $pre
          fi
